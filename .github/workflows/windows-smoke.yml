name: windows-smoke

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Color math check
        run: dotnet run --project check
      - name: Publish single-file exe
        run: dotnet publish src -c Release -o dist
      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: smoke/
